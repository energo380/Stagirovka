<!DOCTYPE html>
<!-- ============================================================
     УЧЁТ СТАЖИРОВОК ЭЛЕКТРОТЕХНИЧЕСКОГО ПЕРСОНАЛА
     Версия 1.0

     Кладётся рядом с templates.js. Больше ничего не нужно.

     ПЕРЕД ЗАПУСКОМ: вписать адрес веб-приложения Apps Script
     в константу API_URL (строка помечена ниже).
     ============================================================ -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стажировки</title>
<script src="templates.js"></script>
<style>
:root {
    --paper:   #edf0f3;
    --surface: #ffffff;
    --ink:     #16202a;
    --muted:   #64717e;
    --line:    #d6dce2;
    --accent:  #8a5a00;
    --soft:    #f6efe2;
    --ok:      #2e6b4f;
    --warn:    #a33a1e;

    --serif: Georgia, 'Times New Roman', serif;
    --sans:  -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    --mono:  ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.45;
}

button, input, select { font-family: inherit; font-size: 15px; color: inherit; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- кнопки ---------- */
.btn {
    padding: 9px 16px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-main { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-main:hover { background: #714a00; border-color: #714a00; }
.btn-danger { color: var(--warn); border-color: #e3c4bc; }
.btn-danger:hover { background: #fdf2ef; }
.btn-sm { padding: 5px 10px; font-size: 13px; }

/* ---------- вход ---------- */
.login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.login-box {
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 32px 28px;
}
.login-box h1 {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: normal;
    margin: 0 0 4px;
}
.login-box p { margin: 0 0 22px; color: var(--muted); font-size: 13px; }
.login-box input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    margin-bottom: 14px;
}
.login-box .btn { width: 100%; }
.login-err { margin-top: 12px; color: var(--warn); font-size: 13px; min-height: 18px; }

/* ---------- каркас ---------- */
.app { display: none; max-width: 1080px; margin: 0 auto; padding: 0 16px 60px; }

.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 22px 0 16px;
    border-bottom: 1px solid var(--line);
}
.top h1 {
    font-family: var(--serif);
    font-weight: normal;
    font-size: 24px;
    margin: 0;
}
.top .org { color: var(--muted); font-size: 13px; }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.top-right label { font-size: 13px; color: var(--muted); }
.top-right select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }

/* ---------- сроки ---------- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 0; }
.chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    font-size: 13px;
    cursor: pointer;
}
.chip:hover { border-color: var(--muted); }
.chip b { font-family: var(--mono); font-size: 13px; }
.chip.hot { border-color: #e0c4b8; background: #fdf4f1; color: var(--warn); }
.chip.zero { color: var(--muted); cursor: default; }
.chip.zero:hover { border-color: var(--line); }

/* ---------- фильтры ---------- */
.filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    padding-bottom: 14px;
}
.filters input, .filters select {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--surface);
}
.filters input { flex: 1 1 180px; min-width: 140px; }
.filters .spacer { flex: 1 1 auto; }

/* ---------- реестр ---------- */
.register {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
}
.row {
    display: grid;
    grid-template-columns: 62px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 13px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    background: none;
    border-left: 0; border-right: 0; border-top: 0;
    width: 100%;
    text-align: left;
}
.row:last-child { border-bottom: none; }
.row:hover { background: #f7f9fb; }

.row-num { font-family: var(--mono); font-size: 15px; color: var(--muted); }
.row-name { font-weight: 600; }
.row-sub { font-size: 13px; color: var(--muted); }
.row-sub .cancelled { color: var(--warn); }

/* Подпись стадий: С - стажировка, А - акт, Д - допуск.
   Буквы те же, что в номерах распоряжений. */
.track { display: flex; gap: 3px; }
.track span {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    background: var(--surface);
    transition: background .18s, color .18s, border-color .18s;
}
.track span.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.track.cancelled span { opacity: .35; }

.empty { padding: 44px 20px; text-align: center; color: var(--muted); }
.more { text-align: center; padding: 14px 0; }
.count { text-align: center; color: var(--muted); font-size: 12px; padding-bottom: 8px; }

/* ---------- модальные окна ---------- */
.overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(22,32,42,.45);
    z-index: 100;
    padding: 20px;
    overflow-y: auto;
}
.overlay.open { display: block; }
.modal {
    max-width: 760px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 6px;
    overflow: hidden;
}
.modal-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
}
.modal-top h2 { font-family: var(--serif); font-weight: normal; font-size: 20px; margin: 0; }
.modal-top .num { font-family: var(--mono); color: var(--muted); font-size: 14px; }
.x { border: none; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 8px; }
.x:hover { color: var(--ink); }
.modal-body { padding: 20px; }
.modal-foot {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    background: #fafbfc;
}
.modal-foot .spacer { flex: 1 1 auto; }

/* ---------- форма ---------- */
fieldset { border: none; border-top: 1px solid var(--line); margin: 0 0 18px; padding: 14px 0 0; }
fieldset:first-of-type { border-top: none; padding-top: 0; }
legend {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--muted);
    padding: 0 8px 0 0;
}
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.f { display: flex; flex-direction: column; gap: 5px; }
.f.wide { grid-column: 1 / -1; }
.f label { font-size: 12px; color: var(--muted); }
.f input, .f select {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--surface);
    width: 100%;
}
.f input[type=date] { font-family: var(--mono); }
.req label::after { content: ' *'; color: var(--accent); }

/* ---------- сканы ---------- */
.files { margin-top: 6px; }
.file {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
}
.file:last-child { border-bottom: none; }
.file a { color: var(--accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file a:hover { text-decoration: underline; }
.file .meta { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
.upload { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.upload select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); font-size: 14px; }

/* ---------- очередь ---------- */
.qbtn {
    position: fixed; left: 16px; bottom: 16px;
    display: none; align-items: center; gap: 8px;
    padding: 9px 15px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    box-shadow: 0 3px 14px rgba(22,32,42,.18);
    font-size: 13px;
    cursor: pointer;
    z-index: 90;
}
.qbtn.show { display: inline-flex; }
.qbtn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.qbtn.sending .dot { background: var(--accent); animation: pulse 1s infinite; }
.qbtn.error   .dot { background: var(--warn); }
.qbtn.done    .dot { background: var(--ok); }
@keyframes pulse { 50% { opacity: .25; } }

.qitem { border-bottom: 1px solid var(--line); padding: 12px 0; display: flex; gap: 12px; align-items: flex-start; }
.qitem:last-child { border-bottom: none; }
.qitem .main { flex: 1 1 auto; min-width: 0; }
.qitem .t { font-weight: 600; }
.qitem .s { font-size: 13px; color: var(--muted); }
.qitem .e { font-size: 13px; color: var(--warn); }

/* ---------- служебное ---------- */
.bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--soft); overflow: hidden; display: none; z-index: 200; }
.bar.on { display: block; }
.bar::before {
    content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 30%;
    background: var(--accent);
    animation: run 1.1s linear infinite;
}
@keyframes run { from { transform: translateX(-100%); } to { transform: translateX(430%); } }

.toast {
    position: fixed; right: 16px; bottom: 16px;
    max-width: 340px;
    padding: 12px 16px;
    border-radius: 4px;
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    z-index: 300;
    transform: translateY(160%);
    transition: transform .22s;
}
.toast.show { transform: translateY(0); }
.toast.err { background: var(--warn); }

.hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

/* Документы для печати: на экране скрыты всегда */
#printArea { display: none; }

@media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
}

@media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .row { grid-template-columns: 48px 1fr; }
    .row .track { grid-column: 2; }
    .modal-foot { position: sticky; bottom: 0; }
}

@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="bar" id="bar"></div>
<div class="toast" id="toast"></div>

<!-- ВХОД -->
<div class="login" id="login">
    <div class="login-box">
        <h1>Стажировки</h1>
        <p>Учёт стажировок электротехнического персонала</p>
        <input type="password" id="pass" placeholder="Пароль" autocomplete="current-password">
        <button class="btn btn-main" onclick="login()">Войти</button>
        <div class="login-err" id="loginErr"></div>
    </div>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div class="app" id="app">
    <div class="top">
        <div>
            <h1>Стажировки</h1>
            <div class="org" id="org"></div>
        </div>
        <div class="top-right">
            <label for="user">Работает:</label>
            <select id="user" onchange="rememberUser()"></select>
            <button class="btn" onclick="logout()">Выйти</button>
        </div>
    </div>

    <div class="chips" id="chips"></div>

    <div class="filters">
        <input type="search" id="q" placeholder="Поиск по фамилии или номеру" oninput="searchDebounced()">
        <select id="fDept" onchange="loadList(false)"><option value="">Все подразделения</option></select>
        <select id="fStatus" onchange="loadList(false)"><option value="">Любой статус</option></select>
        <select id="fYear" onchange="loadList(false)"><option value="">Все годы</option></select>
        <span class="spacer"></span>
        <button class="btn btn-main" onclick="openCard(null)">Новая карточка</button>
    </div>

    <div class="register" id="register"></div>
    <div class="more" id="more" style="display:none">
        <button class="btn" onclick="loadList(true)">Показать ещё</button>
    </div>
    <div class="count" id="count"></div>
</div>

<!-- КАРТОЧКА -->
<div class="overlay" id="cardModal">
  <div class="modal">
    <div class="modal-top">
        <h2 id="cardTitle">Новая карточка</h2>
        <span class="num" id="cardNum"></span>
        <button class="x" onclick="closeCard()" aria-label="Закрыть">×</button>
    </div>
    <div class="modal-body">
        <div id="cardForm"></div>
        <div id="filesBlock" style="display:none">
            <fieldset>
                <legend>Сканы подписанных документов</legend>
                <div class="files" id="filesList"></div>
                <div class="upload">
                    <select id="docType"></select>
                    <input type="file" id="fileInput" accept="image/*,application/pdf" onchange="uploadFiles()">
                </div>
                <p class="hint" style="margin-top:10px">
                    Фотографии сжимаются в браузере перед отправкой, файлы кладутся на Google Диск.
                </p>
            </fieldset>
        </div>
    </div>
    <div class="modal-foot" id="cardFoot"></div>
  </div>
</div>

<!-- СПИСОК ПО СРОКАМ -->
<div class="overlay" id="dueModal">
  <div class="modal" style="max-width:560px">
    <div class="modal-top">
        <h2 id="dueTitle">Сроки</h2>
        <button class="x" onclick="close_('dueModal')" aria-label="Закрыть">×</button>
    </div>
    <div class="modal-body" id="dueBody"></div>
  </div>
</div>

<!-- ОЧЕРЕДЬ -->
<div class="overlay" id="queueModal">
  <div class="modal" style="max-width:560px">
    <div class="modal-top">
        <h2>Очередь отправки</h2>
        <button class="x" onclick="close_('queueModal')" aria-label="Закрыть">×</button>
    </div>
    <div class="modal-body" id="queueBody"></div>
    <div class="modal-foot">
        <button class="btn" onclick="clearSent()">Убрать отправленные</button>
        <span class="spacer"></span>
        <button class="btn" onclick="close_('queueModal')">Закрыть</button>
    </div>
  </div>
</div>

<button class="qbtn" id="qbtn" onclick="open_('queueModal'); renderQueue()">
    <span class="dot"></span><span id="qtext">Очередь</span>
</button>

<div id="printArea"></div>

<script>
/* ============================================================
   НАСТРОЙКА
   ============================================================ */

/* ВСТАВИТЬ СЮДА адрес веб-приложения Apps Script (оканчивается на /exec) */
const API_URL = 'https://script.google.com/macros/s/AKfycbyPTA3CZptmLNNczq_5eNtxmAASPB9UxVpkyXOnvCIoaCDcX3Q_dQuJ1eglGY094xsbtw/exec';

const TIMEOUT = 120000;
const PAGE = 20;
const RETRIES = [20000, 60000, 150000];
const MAX_MB = 8;

/* Статусы продублированы из Setup.gs. Если правите список там,
   поправьте и здесь - init их не передаёт. */
const STATUSES = [
    'Стажировка назначена',
    'Стажировка пройдена',
    'Допущен к самостоятельной работе',
    'Аннулировано'
];

const CATEGORIES = ['оперативно-ремонтного', 'ремонтного', 'оперативного', 'административно-технического'];
const GROUPS = ['II до 1000 В', 'III до 1000 В', 'III до и выше 1000 В',
                'IV до 1000 В', 'IV до и выше 1000 В', 'V до и выше 1000 В'];

/* Состав формы. Порядок полей = порядок на экране.
   Ключи совпадают с заголовками листа «Реестр». */
const FORM = [
  { title: 'Работник', fields: [
      ['ФИО полное', 'text', { req: true, wide: true }],
      ['Должность', 'text', { req: true }],
      ['Подразделение', 'dept', { req: true }],
      ['Дата рождения', 'date'],
      ['Образование', 'text']
  ]},
  { title: 'Стажировка', fields: [
      ['Дата распоряжения о стажировке', 'date', { req: true }],
      ['Количество смен', 'number', { req: true }],
      ['Дата начала стажировки', 'date', { req: true }],
      ['Дата окончания стажировки', 'date', { req: true }],
      ['Руководитель стажировки ФИО', 'person:руководитель:full'],
      ['Руководитель стажировки должность', 'text'],
      ['Контроль ФИО', 'person:контроль:short'],
      ['Контроль должность', 'text'],
      ['Подписал ФИО', 'person:подписант:short'],
      ['Подписал должность', 'text'],
      ['Согласовал ФИО', 'person:согласующий:short'],
      ['Согласовал должность', 'text']
  ]},
  { title: 'Акт стажировки', fields: [
      ['Дата акта', 'date']
  ]},
  { title: 'Допуск к самостоятельной работе', fields: [
      ['Дата распоряжения о допуске', 'date'],
      ['Допущен с', 'date'],
      ['Цех закрепления', 'dept'],
      ['Категория персонала', 'select:CATEGORIES'],
      ['Группа по электробезопасности', 'select:GROUPS'],
      ['Протокол проверки знаний номер', 'text'],
      ['Протокол проверки знаний дата', 'date']
  ]}
];

/* Какое поле должность заполняется вместе с каким полем ФИО */
const POST_OF = {
    'Руководитель стажировки ФИО': 'Руководитель стажировки должность',
    'Контроль ФИО': 'Контроль должность',
    'Подписал ФИО': 'Подписал должность',
    'Согласовал ФИО': 'Согласовал должность'
};

const S = {
    pass: '', user: '', org: '',
    departments: [], people: [], docTypes: [],
    offset: 0, total: 0,
    current: null, files: [],
    all: []
};


/* ============================================================
   СЛУЖЕБНОЕ
   ============================================================ */

function esc(v) {
    return String(v === null || v === undefined ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function $(id) { return document.getElementById(id); }
function open_(id) { $(id).classList.add('open'); }
function close_(id) { $(id).classList.remove('open'); }
function bar(on) { $('bar').classList.toggle('on', !!on); }

let toastTimer = null;
function toast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 4200);
}

/* «20.06.2026» <-> «2026-06-20» для input type=date */
function toISO(ru) {
    const m = String(ru || '').match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    return m ? m[3] + '-' + m[2] + '-' + m[1] : '';
}
function fromISO(iso) {
    const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? m[3] + '.' + m[2] + '.' + m[1] : '';
}
function ruToDate(ru) {
    const iso = toISO(ru);
    return iso ? new Date(iso + 'T00:00:00') : null;
}
function daysUntil(ru) {
    const d = ruToDate(ru);
    if (!d) return null;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    return Math.round((d - today) / 86400000);
}
function plusYear(ru) {
    const d = ruToDate(ru);
    if (!d) return '';
    d.setFullYear(d.getFullYear() + 1);
    return String(d.getDate()).padStart(2, '0') + '.' +
           String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
}


/* ============================================================
   ЗАПРОСЫ
   Обычные - через JSONP: Apps Script не отвечает на предварительный
   запрос OPTIONS, который браузер шлёт перед обычным fetch.
   Загрузка файлов - POST с Content-Type: text/plain, при нём
   предварительный запрос не возникает.
   ============================================================ */

function api(params) {
    return new Promise(function (resolve) {
        const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
        const url = new URL(API_URL);
        Object.keys(params).forEach(function (k) {
            if (params[k] !== undefined && params[k] !== null) url.searchParams.append(k, params[k]);
        });
        url.searchParams.append('callback', cb);

        let done = false, timer = null, tag = null;

        function cleanup() {
            done = true;
            if (timer) clearTimeout(timer);
            try { delete window[cb]; } catch (e) { window[cb] = undefined; }
            if (tag && tag.parentNode) tag.parentNode.removeChild(tag);
        }

        window[cb] = function (data) { if (!done) { resolve(data); cleanup(); } };

        timer = setTimeout(function () {
            if (!done) { resolve({ success: false, error: 'Сервер не ответил', net: true }); cleanup(); }
        }, TIMEOUT);

        tag = document.createElement('script');
        tag.src = url.toString();
        tag.onerror = function () {
            if (!done) { resolve({ success: false, error: 'Нет связи с сервером', net: true }); cleanup(); }
        };
        document.head.appendChild(tag);
    });
}

async function apiPost(payload) {
    try {
        const r = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        });
        return await r.json();
    } catch (e) {
        return { success: false, error: 'Нет связи с сервером', net: true };
    }
}

/** Заполняет select. Если текущего значения нет в списке, добавляет его. */

function buildForm(data) {
    const d = data || {};
    const cancelled = d['Статус'] === 'Аннулировано';

    $('cardForm').innerHTML = FORM.map(function (block) {
        return '<fieldset><legend>' + esc(block.title) + '</legend><div class="grid">' +
            block.fields.map(function (f) { return fieldHtml(f, d); }).join('') +
            '</div></fieldset>';
    }).join('');

        $('cardForm').querySelectorAll('input,select').forEach(function (el) { el.disabled = true; });
        $('cardForm').insertAdjacentHTML('afterbegin',
            '<p class="hint" style="color:var(--warn)">Карточка аннулирована: ' +
            esc(d['Причина аннулирования'] || '') + '. Правка запрещена.</p>');
    }

    // Черновик новой карточки сохраняем при каждом изменении
    if (!S.current) {
        $('cardForm').addEventListener('input', saveDraft);
    }
}

function fieldHtml(f, d) {
    const name = f[0], kind = f[1], opt = f[2] || {};
    const value = d[name] === undefined || d[name] === null ? '' : String(d[name]);
    const cls = 'f' + (opt.wide ? ' wide' : '') + (opt.req ? ' req' : '');
    const id = 'fld_' + FORM_ID(name);
    let control;

    if (kind === 'date') {
        control = '<input type="date" id="' + id + '" data-name="' + esc(name) +
                  '" value="' + esc(toISO(value)) + '">';

    } else if (kind === 'number') {
        control = '<input type="number" min="1" max="60" id="' + id + '" data-name="' + esc(name) +
                  '" value="' + esc(value || 14) + '">';

    } else if (kind === 'dept') {
        control = selectHtml(id, name, S.departments, value, '—');

    } else if (kind.indexOf('select:') === 0) {
        const list = kind.slice(7) === 'CATEGORIES' ? CATEGORIES : GROUPS;
        control = selectHtml(id, name, list, value, '—');

    } else if (kind.indexOf('person:') === 0) {
        const parts = kind.split(':');
        const role = parts[1], form = parts[2];
        const list = S.people
            .filter(function (p) { return p.roles.indexOf(role) !== -1; })
            .map(function (p) { return form === 'short' ? p.short : p.full; });
        control = selectHtml(id, name, list, value, '—', ' onchange="pickPerson(this)"');

    } else {
        control = '<input type="text" id="' + id + '" data-name="' + esc(name) +
                  '" value="' + esc(value) + '">';
    }

    return '<div class="' + cls + '"><label for="' + id + '">' + esc(name) + '</label>' + control + '</div>';
}

function selectHtml(id, name, list, value, emptyLabel, extra) {
    const items = list.slice();
    if (value && items.indexOf(value) === -1) items.unshift(value);
    return '<select id="' + id + '" data-name="' + esc(name) + '"' + (extra || '') + '>' +
        '<option value="">' + esc(emptyLabel) + '</option>' +
        items.map(function (o) {
            return '<option value="' + esc(o) + '"' + (o === value ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
}

function FORM_ID(name) { return name.replace(/[^\wа-яА-ЯёЁ]/g, '_'); }

/** Выбрали человека в справочнике - подставляем его должность рядом. */
function pickPerson(sel) {
    const name = sel.getAttribute('data-name');
    const postField = POST_OF[name];
    if (!postField) return;

    const person = S.people.filter(function (p) {
        return p.full === sel.value || p.short === sel.value;
    })[0];
    if (!person) return;

    const target = document.querySelector('[data-name="' + postField + '"]');
    if (target && !target.value) target.value = person.post;
}

function collectForm() {
    const out = {};
    $('cardForm').querySelectorAll('[data-name]').forEach(function (el) {
        const name = el.getAttribute('data-name');
        out[name] = el.type === 'date' ? fromISO(el.value) : el.value.trim();
    });
    return out;
}

    const isNew = !(S.current && S.current['id']);

    queueAdd({
        id: 'q_' + Date.now() + '_' + Math.floor(Math.random() * 1e6),
        status: 'pending',
        created: new Date().toLocaleString('ru-RU'),
        action: isNew ? 'save' : 'update',
        cardId: isNew ? '' : S.current['id'],

/** Сжатие происходит само, от пользователя ничего не требуется. */
function compressImage(file) {
    return new Promise(function (resolve, reject) {
        const img = new Image();
        img.onload = function () {
            const max = 1600;
            const scale = Math.min(1, max / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(img.src);
            resolve(canvas.toDataURL('image/jpeg', 0.7).split(',')[1]);
        };
        img.onerror = function () { reject(new Error('Не удалось прочитать изображение')); };
        img.src = URL.createObjectURL(file);
    });
}

function readBase64(file) {
    return new Promise(function (resolve, reject) {
        const fr = new FileReader();
        fr.onload = function () { resolve(String(fr.result).split(',')[1]); };
        fr.onerror = function () { reject(new Error('Не удалось прочитать файл')); };
        fr.readAsDataURL(file);
    });
}

async function uploadFiles() {
    const input = $('fileInput');
    const file = input.files[0];
    if (!file || !S.current || !S.current['id']) return;

    bar(true);
    try {
        const isImage = file.type.indexOf('image/') === 0;
        const data = isImage ? await compressImage(file) : await readBase64(file);

        if (data.length * 0.75 > MAX_MB * 1024 * 1024) {
            throw new Error('Файл больше ' + MAX_MB + ' МБ');
        }

        const r = await apiPost({
            action: 'upload', password: S.pass,
            cardId: S.current['id'], docType: $('docType').value,
            user: S.user, mime: isImage ? 'image/jpeg' : file.type, data: data
        });

        if (!r.success) throw new Error(r.error || 'Не удалось загрузить');

        toast('Скан загружен');
        const f = await api({ action: 'files', password: S.pass, cardId: S.current['id'] });
        if (f.success) { S.files = f.files; renderFiles(); }

    } catch (e) {
        toast(e.message, true);
    } finally {
        bar(false);
        input.value = '';
    }
}

/* ============================================================
   ОЧЕРЕДЬ ОТПРАВКИ
   Запись сначала ложится в память браузера, потом уходит на сервер.
   При создании карточки идёт clientId - сервер по нему отсекает
   повтор, поэтому досылка после обрыва связи не создаёт дубля.
   ============================================================ */

function queueLoad() {
    try {
        const a = JSON.parse(localStorage.getItem('queue') || '[]');
        return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
}
function queueSave(a) {
    try { localStorage.setItem('queue', JSON.stringify(a)); } catch (e) {}
    renderQueueButton();
    if ($('queueModal').classList.contains('open')) renderQueue();
}
function queueAdd(item) { const a = queueLoad(); a.push(item); queueSave(a); }
function queueSet(id, changes) {
    const a = queueLoad();
    a.forEach(function (it) { if (it.id === id) Object.assign(it, changes); });
    queueSave(a);
}
function unsentCount() {
    return queueLoad().filter(function (it) { return it.status !== 'sent'; }).length;
}
function clearSent() {
    queueSave(queueLoad().filter(function (it) { return it.status !== 'sent'; }));
}

/* Зависшие «отправляется» после перезагрузки возвращаем в очередь:
   повтор безопасен, сервер отсечёт дубль по clientId. */
function queueRecover() {
    const a = queueLoad();
    let changed = false;
    a.forEach(function (it) {
        if (it.status === 'sending') { it.status = 'pending'; changed = true; }
    });
    if (changed) queueSave(a);
}

let queueBusy = false, retryTimer = null;

async function queueProcess() {
    if (queueBusy || !S.pass) return;

    const next = queueLoad().filter(function (it) { return it.status === 'pending'; })[0];
    if (!next) return;

    queueBusy = true;
    queueSet(next.id, { status: 'sending', lastError: '' });

    const params = {
        action: next.action, password: S.pass, user: S.user,
        card: encodeURIComponent(JSON.stringify(next.card))
    };
    if (next.action === 'save') params.clientId = next.id;
    else params.id = next.cardId;

    const r = await api(params);
    queueBusy = false;

    if (r && r.success) {
        queueSet(next.id, { status: 'sent', lastError: '' });
        toast(r.duplicate ? 'Уже было записано ранее'
            : (next.action === 'save' ? 'Карточка записана под № ' + r.number : 'Изменения сохранены'));

        loadList(false);
        loadDue();

        // Если карточка всё ещё открыта - перечитываем её,
        // чтобы появились номер, печать и вложения
        const openedId = r.id || next.cardId;
        if ($('cardModal').classList.contains('open') && openedId) openCard(openedId);

        setTimeout(queueProcess, 400);
        return;
    }

    const attempts = (next.attempts || 0) + 1;
    const msg = (r && r.error) || 'Нет связи с сервером';

    queueSet(next.id, { status: 'error', lastError: msg, attempts: attempts });

    if (r && r.net) {
        // Обрыв связи - пробуем ещё раз сами
        toast('Не ушло: ' + msg + '. Повторю автоматически.', true);
        scheduleRetry(attempts);
    } else {
        // Сервер ответил отказом: данные не пройдут и со второй попытки
        toast(msg, true);
    }
}

function scheduleRetry(attempts) {
    if (attempts > RETRIES.length) return;
    clearTimeout(retryTimer);
    retryTimer = setTimeout(function () {
        const a = queueLoad();
        a.forEach(function (it) { if (it.status === 'error') it.status = 'pending'; });
        queueSave(a);
        queueProcess();
    }, RETRIES[attempts - 1]);
}

function retryItem(id) { queueSet(id, { status: 'pending', attempts: 0, lastError: '' }); queueProcess(); }
function dropItem(id) {
    const it = queueLoad().filter(function (x) { return x.id === id; })[0];
    if (it && it.status !== 'sent' && !confirm('Убрать из очереди? Запись не будет отправлена.')) return;
    queueSave(queueLoad().filter(function (x) { return x.id !== id; }));
}

function renderQueueButton() {
    const a = queueLoad();
    const btn = $('qbtn');
    if (!a.length) { btn.classList.remove('show'); return; }

    const has = function (s) { return a.some(function (it) { return it.status === s; }); };
    btn.className = 'qbtn show' +
        (has('sending') ? ' sending' : has('error') ? ' error' : has('pending') ? '' : ' done');
    $('qtext').textContent =
        has('sending') ? 'Отправка' : has('error') ? 'Не ушло' :
        has('pending') ? 'Ожидание' : 'Отправлено';
}

function renderQueue() {
    const a = queueLoad();
    if (!a.length) { $('queueBody').innerHTML = '<p class="hint">Очередь пуста.</p>'; return; }

    const label = { pending: 'В очереди', sending: 'Отправляется', error: 'Не ушло', sent: 'Записано' };

    $('queueBody').innerHTML = a.slice().reverse().map(function (it) {
        return '<div class="qitem"><div class="main">' +
            '<div class="t">' + esc(it.label) + '</div>' +
            '<div class="s">' + (it.action === 'save' ? 'новая карточка' : 'изменения') +
                ' · ' + esc(it.created) + ' · ' + label[it.status] + '</div>' +
            (it.lastError ? '<div class="e">' + esc(it.lastError) + '</div>' : '') +
            '</div><div>' +
            (it.status === 'error' ? '<button class="btn btn-sm" onclick="retryItem(\'' + esc(it.id) + '\')">Отправить</button> ' : '') +
            '<button class="btn btn-sm" onclick="dropItem(\'' + esc(it.id) + '\')">Убрать</button>' +
            '</div></div>';
    }).join('');
}

// Стили документов берутся из templates.js: один источник
// и для предпросмотра, и для печати с сайта
const docStyle = document.createElement('style');
docStyle.textContent = DOC_CSS;
document.head.appendChild(docStyle);

$('pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });

document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    ['cardModal', 'dueModal', 'queueModal'].forEach(function (id) {
        if ($(id).classList.contains('open')) close_(id);
    });
});

window.addEventListener('online', function () {
    toast('Связь восстановилась, дошлю очередь');
    const a = queueLoad();
    a.forEach(function (it) { if (it.status === 'error') { it.status = 'pending'; it.attempts = 0; } });
    queueSave(a);
    queueProcess();
});

window.addEventListener('offline', function () { toast('Связи нет. Записи сохраняются в очереди.', true); });

window.addEventListener('beforeunload', function (e) {
    if (unsentCount() > 0) { e.preventDefault(); e.returnValue = ''; }
});

window.addEventListener('load', async function () {
    queueRecover();
    renderQueueButton();

    const saved = sessionStorage.getItem('auth');
    if (!saved) return;

    bar(true);
    const r = await api({ action: 'init', password: saved });
    bar(false);
    if (r.success) { S.pass = saved; applyInit(r); start(); }
    else sessionStorage.removeItem('auth');
});
</script>
